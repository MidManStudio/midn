# crates/mme-sim/Cargo.toml
[package]
name    = "mme-sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mme-sim"
path = "src/main.rs"

[dependencies]
midn-transport     = { path = "../midn-transport" }
midn-proto         = { path = "../midn-proto" }
midn-core          = { path = "../midn-core" }
midn-userplane     = { path = "../midn-userplane" }
midn-auth          = { path = "../midn-auth" }
bytes              = "1.5"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tracing            = "0.1"
tracing-subscriber = "0.3"
