# .github/workflows/midn-sim-smoke-test.yml
#
# NOTE: this file's actual name in the repo (midn-sim-smoke-test.yml) no
# longer matches what it does — its content is the netns+veth cross-
# namespace test (originally delivered as a separate
# midn-sim-netns-smoke-test.yml). The original loopback/combined-mode
# smoke test that used to live under this filename isn't present in the
# repo anymore either. Flagging this plainly rather than guessing which
# one you actually want — see the accompanying message.
#
# `midn-sim-smoke-test.yml` proves the AMF and UE/gNB talk real bytes over a
# real socket — but both sides are still two Tokio tasks in one process on
# loopback. This workflow is the next rung: two independent OS processes,
# each in its own network namespace, connected only by a veth pair with
# real (non-loopback) point-to-point IPs — the shape the project's own
# "$0 Linux box" goal actually needs (multiple simulated nodes on one
# machine, genuinely IP-isolated from each other, not just separate
# threads pretending). Uses `midn-sim`'s `--role amf` / `--role ue` split
# (see that file's doc comment) — two Tokio tasks in one process can't be
# placed in two network namespaces, only two real processes can.
#
# Three layers, cheapest first, each gating the next:
#   1. netns + veth setup, verified with a plain ping — if the namespaces
#      or the veth pair themselves are broken, fail here with an obvious
#      diagnostic instead of a confusing timeout three steps later inside
#      an SCTP handshake.
#   2. `midn-sim --role amf` really bound the veth IP (10.99.0.1:38412),
#      not loopback — the one check that actually distinguishes this
#      workflow from `midn-sim-smoke-test.yml` re-run with extra steps.
#   3. The same Registration-procedure checkpoints
#      `midn-sim-smoke-test.yml` already checks, just split across two
#      real per-process logs (amf.log / ue.log) instead of one.
#
# Deliberately its own workflow, same reasoning `midn-sim-smoke-test.yml`
# gives for not touching `midn-test.yml`'s 680 lines blind — this one is
# newer and riskier still (root-ish privileges, host network state), so it
# stays isolated even from that file.

name: midn-sim — netns Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Real per-process SCTP + netns overhead is still well under a second on
  # GitHub's runners — this only bounds the job in case something hangs
  # (e.g. the veth pair silently not routing and the SCTP handshake
  # retrying forever). Not expected to actually be hit on a successful run.
  RUN_TIMEOUT_SECONDS: 30
  AMF_ADDR: 10.99.0.1
  UE_ADDR: 10.99.0.2
  AMF_PORT: 38412

jobs:
  netns-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      # Same key prefix midn-test.yml / midn-sim-smoke-test.yml use — reuses
      # whatever either of those already downloaded.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-midn-sim-${{ hashFiles('crates/midn-transport/Cargo.toml', 'crates/midn-sim/Cargo.toml') }}
          restore-keys: |
            cargo-registry-midn-sim-
            cargo-registry-midn-
            cargo-registry-

      # Pulls in midn-transport automatically (path dependency) — no
      # separate build step needed, unlike midn-sim-smoke-test.yml which
      # also builds midn-transport standalone for its own offline test.
      - name: Build midn-sim
        run: cargo build -p midn-sim --release

      # GitHub-hosted Ubuntu runners document passwordless sudo and ship
      # iproute2 by default; iputils-ping is very likely already present
      # too, but installing (a no-op if so) removes the doubt rather than
      # assuming it.
      - name: Set up netns + veth pair
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iputils-ping

          sudo ip netns add ns-amf
          sudo ip netns add ns-ue

          sudo ip link add veth-amf type veth peer name veth-ue
          sudo ip link set veth-amf netns ns-amf
          sudo ip link set veth-ue netns ns-ue

          # /30 — the standard minimal point-to-point subnet for a single
          # veth pair, two usable host addresses.
          sudo ip netns exec ns-amf ip addr add ${AMF_ADDR}/30 dev veth-amf
          sudo ip netns exec ns-ue  ip addr add ${UE_ADDR}/30  dev veth-ue

          sudo ip netns exec ns-amf ip link set veth-amf up
          sudo ip netns exec ns-ue  ip link set veth-ue up
          sudo ip netns exec ns-amf ip link set lo up
          sudo ip netns exec ns-ue  ip link set lo up

          echo "--- ns-amf ---"
          sudo ip netns exec ns-amf ip -4 addr show veth-amf
          echo "--- ns-ue ---"
          sudo ip netns exec ns-ue  ip -4 addr show veth-ue

      - name: Verify veth connectivity (ping ns-ue -> ns-amf)
        run: |
          sudo ip netns exec ns-ue ping -c 2 -W 2 "${AMF_ADDR}" \
            > veth-ping.log 2>&1 || true
          cat veth-ping.log

      # AMF runs as a background process for the duration of this step;
      # its PID is written to a file so the teardown step (a fresh shell)
      # can still find and kill it.
      - name: Run midn-sim across the namespace boundary
        run: |
          sudo ip netns exec ns-amf \
            ./target/release/midn-sim --role amf --bind "${AMF_ADDR}:${AMF_PORT}" \
            > amf.log 2>&1 &
          echo $! > amf.pid
          disown

          # Same reasoning as midn-sim's own startup sleep: gives the AMF
          # process a head start on binding before the UE side's first
          # INIT. SCTP's own retransmission covers the rest if this isn't
          # enough.
          sleep 1

          timeout "${RUN_TIMEOUT_SECONDS}"s \
            sudo ip netns exec ns-ue \
            ./target/release/midn-sim --role ue --bind "${UE_ADDR}:0" --amf "${AMF_ADDR}:${AMF_PORT}" \
            > ue.log 2>&1 || true

          # Same drain-delay reasoning midn-sim's own main.rs flags for
          # `run_both`, just across two real OS processes instead of two
          # Tokio tasks: the UE process exiting only proves its last two
          # sends completed locally, not that the AMF process has received
          # or processed either one yet.
          sleep 1

      - name: Tear down netns + veth pair
        if: always()
        run: |
          if [ -f amf.pid ]; then
            sudo kill "$(cat amf.pid)" 2>/dev/null || true
          fi
          # Blunt fallback in case the PID-based kill above didn't land
          # (e.g. sudo's own process tree behavior on this runner) —
          # nothing else on this host runs anything matching this name.
          sudo pkill -f "midn-sim --role amf" 2>/dev/null || true

          # Deleting both namespaces removes both veth ends (the pair
          # lives split across them) — no separate `ip link delete` needed.
          sudo ip netns delete ns-amf 2>/dev/null || true
          sudo ip netns delete ns-ue 2>/dev/null || true

      - name: Check the exchange actually happened, write job summary
        if: always()
        run: |
          python3 - << 'PYEOF'
          import os

          def read_or(path):
              try:
                  with open(path) as f:
                      return f.read()
              except FileNotFoundError:
                  return None

          ping_log = read_or('veth-ping.log')
          amf_log = read_or('amf.log')
          ue_log = read_or('ue.log')

          # (label, log, required substring) — every one of these has to
          # actually appear for the run to count as a real, complete
          # Registration procedure across a genuine namespace boundary,
          # not just "the processes started".
          checks = [
              ("netns+veth: ns-ue reached ns-amf over the veth pair (ping)", ping_log, "0% packet loss"),
              ("AMF: bound the real veth IP, not loopback",     amf_log, f"binding {os.environ['AMF_ADDR']}:{os.environ['AMF_PORT']}"),
              ("AMF: SCTP association established",             amf_log, "[AMF] SCTP association established"),
              ("UE:  SCTP association established",             ue_log,  "[UE ] SCTP association established"),
              ("UE:  sent RegistrationRequest",                 ue_log,  "[UE ] -> RegistrationRequest"),
              ("AMF: routed it, replied with IdentityRequest",  amf_log, "[AMF] -> DownlinkNasTransport"),
              ("UE:  sent IdentityResponse(SUCI)",              ue_log,  "[UE ] -> IdentityResponse(SUCI)"),
              ("UE:  sent AuthenticationResponse (RES*)",       ue_log,  "[UE ] -> AuthenticationResponse(RES*)"),
              ("UE:  sent SecurityModeComplete",                ue_log,  "[UE ] -> SecurityModeComplete"),
              ("AMF: sent InitialContextSetupRequest (Phase B)", amf_log, "[AMF] -> InitialContextSetupRequest"),
              ("AMF: bundled PDU session (N3Event::CreateSession)", amf_log, "N3Event: CreateSession"),
              ("UE:  decrypted RegistrationAccept",             ue_log,  "[UE ] <- RegistrationAccept"),
              ("UE:  sent InitialContextSetupResponse",         ue_log,  "[UE ] -> InitialContextSetupResponse"),
              ("AMF: recorded real DL TEID (N3Event::UpdateBearer)", amf_log, "N3Event: UpdateBearer"),
              ("UE:  sent RegistrationComplete",                ue_log,  "[UE ] -> RegistrationComplete"),
              # User-plane proof, added once midn-sim started actually
              # driving midn-userplane's SessionManager/GtpForwarder from
              # real N3Events instead of just proving the control plane.
              ("UPF: GTP-U forwarder listening",                amf_log, "GTP-U forwarder listening"),
              ("UE:  sent uplink G-PDU",                        ue_log,  "[UE ] -> G-PDU UL"),
              ("UPF: received + routed uplink G-PDU",           amf_log, "[UPF] <- G-PDU UL"),
              ("UE:  user-plane round trip confirmed (payload verified)", ue_log, "user-plane G-PDU round trip confirmed"),
              # Deregistration, added once UeContextReleaseCommand/Complete
              # gained real wire codec support — drives the full lifecycle
              # (Registration -> user-plane -> Deregistration) over the real
              # socket for the first time, not just amf::deregistration's
              # own in-process tests.
              ("UE:  sent DeregistrationRequest",               ue_log,  "[UE ] -> DeregistrationRequest"),
              ("UE:  decrypted DeregistrationAccept",           ue_log,  "[UE ] <- DeregistrationAccept"),
              ("AMF: sent UeContextReleaseCommand",             amf_log, "[AMF] -> UeContextReleaseCommand"),
              ("UE:  sent UeContextReleaseComplete",            ue_log,  "[UE ] -> UeContextReleaseComplete"),
              ("Overall: simulation reported success",          ue_log,  "Deregistration all confirmed"),
          ]

          results = [(label, log is not None and needle in log) for label, log, needle in checks]
          all_ok = all(ok for _, ok in results)

          lines = []
          lines.append("## midn-sim netns Smoke Test")
          lines.append("")
          lines.append(
              "### ✅ Full Registration procedure confirmed across a real network-namespace boundary"
              if all_ok else "### ❌ Exchange incomplete"
          )
          lines.append("")
          lines.append("| Check | Result |")
          lines.append("|---|---|")
          for label, ok in results:
              lines.append(f"| {label} | {'✅' if ok else '❌'} |")
          lines.append("")
          lines.append("<details><summary>veth-ping.log</summary>\n")
          lines.append("```")
          lines.append((ping_log or "(missing — step never produced a log file)").strip())
          lines.append("```")
          lines.append("</details>")
          lines.append("")
          lines.append("<details><summary>amf.log</summary>\n")
          lines.append("```")
          lines.append((amf_log or "(missing — step never produced a log file)").strip())
          lines.append("```")
          lines.append("</details>")
          lines.append("")
          lines.append("<details><summary>ue.log</summary>\n")
          lines.append("```")
          lines.append((ue_log or "(missing — step never produced a log file)").strip())
          lines.append("```")
          lines.append("</details>")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join(lines) + "\n")

          if not all_ok:
              raise SystemExit(1)
          PYEOF
